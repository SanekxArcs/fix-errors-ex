<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo workspace</title>
<style>
  :root{--bg:#f4f5f8;--card:#fff;--line:#e3e6ec;--ink:#1d2433;--soft:#5c6577;--faint:#8b93a3;--accent:#3a5bd9;--side:#eceef3}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);display:flex;overflow:hidden}
  ::selection{background:#b8cdfa}
  .side{width:190px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin:0 8px 18px}
  .logo i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#6b86ea,#3a5bd9);display:block}
  .btn-new{margin:0 4px 14px;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;box-shadow:0 1px 2px #0000000d}
  .nav{padding:7px 12px;border-radius:8px;color:var(--soft);font-size:14px;display:flex;justify-content:space-between}
  .nav.on{background:#dfe5f7;color:var(--accent);font-weight:600}
  .nav b{font-weight:600;color:var(--faint);font-size:12px}
  .label{padding:7px 12px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:56px;flex:none;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;padding:0 22px;gap:14px}
  .search{flex:1;max-width:340px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--faint);font-size:13.5px;display:flex;align-items:center;padding:0 12px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#c9b6f2;margin-left:auto;display:grid;place-items:center;font-size:13px;font-weight:700;color:#4b3a7a}
  .compose{margin:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px -12px #1d243326;display:flex;flex-direction:column;flex:1;min-height:0}
  .row{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 20px;font-size:14px}
  .row span{color:var(--faint);width:58px}
  .chip{background:#eef1f8;border-radius:999px;padding:2px 10px 2px 3px;display:inline-flex;gap:7px;align-items:center;font-weight:600;font-size:13px}
  .chip i{width:20px;height:20px;border-radius:50%;background:#f2c48d;display:block}
  .body{padding:16px 22px;flex:1;outline:none;overflow:auto;font-size:15.5px}
  .body p{margin:0 0 13px}
  .bar{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--line)}
  .send{background:var(--accent);color:#fff;font-weight:600;font-size:14px;border-radius:9px;padding:7px 20px}
  .tool{width:18px;height:18px;border-radius:4px;border:2px solid #c3c8d3}
  .chan{padding:6px 12px;border-radius:8px;color:var(--soft);font-size:14px}
  .chan.on{background:#dfe5f7;color:var(--accent);font-weight:600}
  .thread{flex:1;overflow:auto;padding:20px 26px;display:flex;flex-direction:column;gap:18px;background:var(--card)}
  .msg{display:flex;gap:12px}
  .msg i{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
  .msg b{font-size:14.5px}
  .msg small{color:var(--faint);margin-left:8px;font-size:12px}
  .msg p{margin:2px 0 0}
  .composer{margin:0 22px 20px;border:1px solid #cdd3de;border-radius:12px;background:var(--card);box-shadow:0 1px 3px #0000000f}
  .composer .body{min-height:66px;padding:12px 16px}
  .composer .bar{padding:8px 12px}
  .day{align-self:center;font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:2px 12px}
</style>
</head>
<body>
<script>
const D = /*DEMO*/null;
const view = new URLSearchParams(location.search).get('view') || 'mail';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
if (view === 'mail') {
  const M = D.mail;
  document.body.innerHTML = `
  <nav class="side"><div class="logo"><i></i>Mail</div><div class="btn-new">&#9998;&nbsp; New message</div>
    ${M.folders.map((f, i) => `<div class="nav${f === 'Drafts' ? ' on' : ''}">${f}${i === 0 ? '<b>12</b>' : f === 'Drafts' ? '<b>1</b>' : ''}</div>`).join('')}</nav>
  <main><div class="top"><div class="search">Search mail</div><div class="avatar">A</div></div>
    <section class="compose">
      <div class="row"><span>To</span><div class="chip"><i></i>${esc(M.to)}</div></div>
      <div class="row"><span>Subject</span><b style="font-weight:600">${esc(M.subject)}</b></div>
      <div class="body" id="editor" contenteditable="true" spellcheck="false"><p>${esc(M.greeting)}</p><p id="typo">${esc(M.typo)}</p><p id="ask">${esc(M.ask)}</p><p>${M.signoff.map(esc).join('<br>')}</p></div>
      <div class="bar"><div class="send">Send</div><div class="tool"></div><div class="tool" style="border-radius:50%"></div><div class="tool"></div></div>
    </section></main>`;
} else {
  // ?thread=translit swaps in a short thread whose draft was typed in the wrong keyboard layout.
  const T = new URLSearchParams(location.search).get('thread') === 'translit' ? D.translitThread : null;
  const C = T ? { ...D.chat, active: T.channel, people: T.people, draft: D.translit } : D.chat;
  document.body.innerHTML = `
  <nav class="side"><div class="logo"><i style="background:linear-gradient(135deg,#f3a85b,#e0743a)"></i>${esc(C.workspace)}</div>
    <div class="label">Channels</div>
    ${C.channels.map((c) => `<div class="chan${c === C.active ? ' on' : ''}"># ${esc(c)}</div>`).join('')}</nav>
  <main><div class="top"><b># ${esc(C.active)}</b><div class="avatar">A</div></div>
    <div class="thread"><div class="day">Today</div>
      ${C.people.map((p) => `<div class="msg"><i style="background:${p.color}">${p.name[0]}</i><div><b>${esc(p.name)}</b><small>${p.time}</small><p>${esc(p.text)}</p></div></div>`).join('')}
    </div>
    <div style="background:var(--card);padding-top:4px"><div class="composer">
      <div class="body" id="editor" contenteditable="true" spellcheck="false"><p id="draft" style="margin:0">${esc(C.draft)}</p></div>
      <div class="bar"><div class="tool"></div><div class="tool" style="border-radius:50%"></div><div class="send" style="margin-left:auto;padding:6px 16px">Send</div></div>
    </div></div></main>`;
}

// Helpers for the capture scripts (test side only).
function rangeOf(selector, needle) {
  const el = document.querySelector(selector);
  const r = document.createRange();
  if (!needle) { r.selectNodeContents(el); return r; }
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for (let n; (n = walker.nextNode());) {
    const i = n.data.indexOf(needle);
    if (i >= 0) { r.setStart(n, i); r.setEnd(n, i + needle.length); return r; }
  }
  r.selectNodeContents(el);
  return r;
}
window.__select = (selector, needle) => {
  document.getElementById('editor').focus();
  const r = rangeOf(selector, needle);
  getSelection().removeAllRanges();
  getSelection().addRange(r);
  return String(getSelection());
};
/** Client points on the first and last character of a text, for a real mouse drag. */
window.__dragPoints = (selector, needle) => {
  const rects = [...rangeOf(selector, needle).getClientRects()].filter((r) => r.width > 0);
  const a = rects[0], b = rects.at(-1);
  return { from: { x: a.left + 1, y: a.top + a.height / 2 }, to: { x: b.right - 1, y: b.top + b.height / 2 } };
};
window.__selectionEnd = () => {
  const rects = [...getSelection().getRangeAt(0).getClientRects()].filter((r) => r.width > 0);
  const b = rects.at(-1);
  return { x: b.right, y: b.bottom };
};
window.__text = (selector) => document.querySelector(selector).innerText;
</script>
</body>
</html>
